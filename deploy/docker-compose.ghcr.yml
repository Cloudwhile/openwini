# 直接拉取已发布镜像，无需源码或 Dockerfile。
services:
  api:
    image: ${APP_IMAGE:-ghcr.io/cloudwhile/openwini:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: ${DB_HOST:?请在 .env 中设置外部数据库 DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?请在 .env 中设置 DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:?请在 .env 中设置 DB_NAME}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请在 .env 中设置 APP_ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?请在 .env 中设置 GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?请在 .env 中设置 GITHUB_CLIENT_SECRET}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:?请在 .env 中设置 ADMIN_GITHUB_LOGINS}
      OFFICIAL_GITHUB_LOGIN: ${OFFICIAL_GITHUB_LOGIN:-}
      APP_BASE_URL: ${APP_BASE_URL:?请在 .env 中设置正式 HTTPS 站点地址 APP_BASE_URL}
      COOKIE_SECURE: "true"
      BIND_ADDR: 0.0.0.0:10180
      WEB_DIST_DIR: /web
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RUST_LOG: ${RUST_LOG:-wini_api=info}
    expose:
      - "10180"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
