# 使用官方镜像编译源码并启动服务；PostgreSQL 使用外部实例。
# 复制 .env.example 为 .env 并填写配置后，运行 docker compose up -d。
# 默认不向宿主机发布端口，后续使用 docker network connect 接入代理网络。
services:
  api-build:
    image: rust:1.99.1-bookworm@sha256:48b7f435b8fc6378ce43b44f15e3a47fd8919b2825f835c39bd4bd3da50af5b8
    restart: "no"
    working_dir: /build
    command:
      - sh
      - -ec
      - |
        cargo build --release --locked -p wini-api
        install -m 0755 target/release/wini-api /artifacts/wini-api.next
        mv -f /artifacts/wini-api.next /artifacts/wini-api
    volumes:
      - ./Cargo.toml:/build/Cargo.toml:ro
      - ./Cargo.lock:/build/Cargo.lock:ro
      - ./crates/api:/build/crates/api:ro
      - ./migrations:/build/migrations:ro
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - api-target:/build/target
      - api-bin:/artifacts
    security_opt:
      - no-new-privileges:true

  api:
    image: buildpack-deps:bookworm-curl
    restart: unless-stopped
    depends_on:
      api-build:
        condition: service_completed_successfully
      web-build:
        condition: service_completed_successfully
    user: "10001:10001"
    working_dir: /app
    command: ["/app/wini-api"]
    volumes:
      - api-bin:/app:ro
      - web-dist:/web:ro
    environment:
      APP_ENV: production
      # 外部 PostgreSQL（分键配置，密码无需 URL 编码）
      DB_HOST: ${DB_HOST:?请在 .env 中设置外部数据库 DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?请在 .env 中设置 DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:?请在 .env 中设置 DB_NAME}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请在 .env 中设置 APP_ENCRYPTION_KEY（openssl rand -hex 32）}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?请在 .env 中设置 GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?请在 .env 中设置 GITHUB_CLIENT_SECRET}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
      OFFICIAL_GITHUB_LOGIN: ${OFFICIAL_GITHUB_LOGIN:-}
      BIND_ADDR: 0.0.0.0:10180
      WEB_DIST_DIR: /web
      APP_BASE_URL: ${APP_BASE_URL:?请在 .env 中设置正式 HTTPS 站点地址 APP_BASE_URL}
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RUST_LOG: ${RUST_LOG:-wini_api=info}
    expose:
      - "10180"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "4",
          "http://127.0.0.1:10180/readyz",
        ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-build:
    image: node:24.22.1-alpine3.24@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    restart: "no"
    working_dir: /build
    command:
      - sh
      - -ec
      - |
        tar -C /source --exclude=node_modules --exclude=dist --exclude=.env --exclude='.env.*' -cf /tmp/web-source.tar package.json package-lock.json apps/web packages/ui
        tar -xf /tmp/web-source.tar
        rm /tmp/web-source.tar
        npm ci --no-audit --no-fund
        npm run build --workspace apps/web
    volumes:
      - ./package.json:/source/package.json:ro
      - ./package-lock.json:/source/package-lock.json:ro
      - ./apps/web:/source/apps/web:ro
      - ./packages/ui:/source/packages/ui:ro
      - npm-cache:/root/.npm
      - node-modules:/build/node_modules
      - web-node-modules:/build/apps/web/node_modules
      - ui-node-modules:/build/packages/ui/node_modules
      - web-dist:/build/apps/web/dist
    security_opt:
      - no-new-privileges:true

volumes:
  cargo-registry:
  cargo-git:
  api-target:
  api-bin:
  npm-cache:
  node-modules:
  web-node-modules:
  ui-node-modules:
  web-dist:
